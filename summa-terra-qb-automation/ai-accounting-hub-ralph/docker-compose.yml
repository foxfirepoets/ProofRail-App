# Local infra ONLY: NATS (event bus) + Temporal (durable workflow engine).
# Postgres is NOT here — the canonical store is Supabase-managed (see DATABASE_URL).
services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      - temporal-postgres
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "7233:7233"
    restart: unless-stopped

  # Temporal's OWN metadata store — unrelated to the Supabase canonical store.
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.32.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  temporal-pgdata:
