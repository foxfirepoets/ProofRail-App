document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eight:130px;border-radius:50%;background:radial-gradient(circle,rgba(217,74,74,.5),transparent 70%);filter:blur(6px)\"><\u002Fdiv>\n            <div style=\"position:relative\">\n              <div style=\"display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.5px;color:#f2b8b8;text-transform:uppercase\">\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><\u002Fsvg>P0 Fraud Watch\n              <\u002Fdiv>\n              <div style=\"font-size:16px;font-weight:700;margin-top:11px;line-height:1.3\">1 bank-change attempt caught today<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#e2b7bd;margin-top:8px;line-height:1.5\">Spoofed ACH-update email from <span style=\"font-weight:700;color:#fff\">rockcreek-supply.com<\u002Fspan>. No bill was created; vendor is ATEP-blocked in the Hub.<\u002Fdiv>\n              <a href=\"https://mail.google.com/mail/u/0/#search/subject%3A(banking+OR+ACH+OR+routing)\" target=\"_blank\" rel=\"noopener\" class=\"btn\" style=\"display:block;text-align:center;margin-top:15px;background:#d94a4a;color:#fff;border-radius:10px;padding:10px;font-size:13px;font-weight:700;text-decoration:none\">Review in Gmail<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- POLLER HEALTH -->\n          <div style=\"background:#fff;border:1px solid #e8eaf0;border-radius:14px;padding:var(--card-pad,22px);box-shadow:0 1px 3px rgba(16,24,40,.05)\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <h3 style=\"font-size:14.5px;font-weight:700\">Poller Health<\u002Fh3>\n              <span style=\"font-size:10.5px;font-weight:700;color:#12a150;background:#e6f6ec;padding:3px 8px;border-radius:20px\">Healthy<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:13px;display:flex;flex-direction:column;gap:11px\">\n              <sc-for list=\"{{ health }}\" as=\"h\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between\">\n                  <span style=\"font-size:12.5px;color:#6b7488\">{{ h.k }}<\u002Fspan>\n                  <span style=\"font-size:12.5px;font-weight:700;color: {{ h.color }}\">{{ h.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:13px;padding-top:12px;border-top:1px solid #f1f2f6;font-size:11px;color:#98a0b0;line-height:1.5\">Runs every 10 min under the stone@ Workspace account to stay within Gmail quota.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- CORRESPONDENTS -->\n          <div style=\"background:#fff;border:1px solid #e8eaf0;border-radius:14px;padding:var(--card-pad,22px);box-shadow:0 1px 3px rgba(16,24,40,.05)\">\n            <h3 style=\"font-size:14.5px;font-weight:700\">Key Correspondents<\u002Fh3>\n            <p style=\"font-size:11.5px;color:#8a92a2;margin-top:3px\">Jump to each person's emails<\u002Fp>\n            <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:2px\">\n              <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <a href=\"{{ p.link }}\" target=\"_blank\" rel=\"noopener\" class=\"rowhover\" style=\"display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:9px;text-decoration:none;color:inherit\">\n                  <div style=\"width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color: {{ p.color }};background: {{ p.bg }}\">{{ p.initials }}<\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.name }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#98a0b0\">{{ p.role }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right;flex-shrink:0\">\n                    <div style=\"font-size:12px;font-weight:700\">{{ p.count }}<\u002Fdiv>\n                    <div style=\"font-size:10px;color:#a2aab8\">{{ p.ago }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- BRIDGE TO QB HUB -->\n          <a href=\"Summa%20Terra%20Dashboard.html\" class=\"rowhover\" style=\"display:block;background:#fff;border:1px solid #e8eaf0;border-radius:14px;padding:var(--card-pad,22px);box-shadow:0 1px 3px rgba(16,24,40,.05);text-decoration:none;color:inherit\">\n            <div style=\"display:flex;align-items:center;gap:11px\">\n              <span style=\"width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f5761a,#e6207e);display:flex;align-items:center;justify-content:center;flex-shrink:0\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h13l-3-3M20 17H7l3 3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div style=\"flex:1\">\n                <div style=\"font-size:13px;font-weight:700\">Delivered to the Hub<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#98a0b0\"><span style=\"font-weight:700;color:#12a150\">12<\u002Fspan> events forwarded to QB accounting<\u002Fdiv>\n              <\u002Fdiv>\n              <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c2c8d4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fa>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f9b215&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;,&quot;options&quot;:[&quot;#e6207e&quot;,&quot;#f5761a&quot;,&quot;#f9b215&quot;,&quot;#7a3bd0&quot;]},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Compact&quot;,&quot;options&quot;:[&quot;Comfortable&quot;,&quot;Compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;feedFilter&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;All&quot;,&quot;options&quot;:[&quot;All&quot;,&quot;Needs action&quot;,&quot;Fraud&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Inbox&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const accent = this.props.accent || '#e6207e';\n    const density = this.props.density || 'Comfortable';\n    const filter = this.props.feedFilter || 'All';\n    const cardPad = density === 'Compact' ? '15px' : '22px';\n\n    const G = 'https://mail.google.com/mail/u/0/#';\n    const fromLink = email => G + 'search/from%3A' + encodeURIComponent(email);\n\n    // ---- Event type styling ----\n    const T = {\n      invoice: { type: 'INVOICE',  tColor: '#b3186a', tBg: '#fbe6f0' },\n      approval:{ type: 'APPROVAL', tColor: '#0f7a3d', tBg: '#e6f6ec' },\n      draw:    { type: 'DRAW',     tColor: '#c25e10', tBg: '#fdeede' },\n      bank:    { type: 'BANK CHG', tColor: '#c0392b', tBg: '#fdecec' },\n      payment: { type: 'PAYMENT',  tColor: '#0e7f8f', tBg: '#e2f5f5' },\n    };\n    // ---- Tracker status chips ----\n    const S = {\n      received:{ sColor: '#6b7488', sBg: '#eef0f4', status: 'Received' },\n      review:  { sColor: '#c25e10', sBg: '#fdeede', status: 'Ready for review' },\n      mike:    { sColor: '#0f7a3d', sBg: '#e6f6ec', status: 'Approved by Mike' },\n      feegen:  { sColor: '#6a34c0', sBg: '#efe9fb', status: 'Fees generated' },\n      submitted:{ sColor: '#6b7488', sBg: '#eef0f4', status: 'Draw submitted' },\n      booked:  { sColor: '#0e7f8f', sBg: '#e2f5f5', status: 'Booked in QB' },\n      paid:    { sColor: '#0f7a3d', sBg: '#e6f6ec', status: 'Paid' },\n      risk:    { sColor: '#c0392b', sBg: '#fdecec', status: 'Bank Change Risk' },\n    };\n    const av = [\n      { avColor: '#b3186a', avBg: '#fbe6f0' }, { avColor: '#0f7a3d', avBg: '#e6f6ec' },\n      { avColor: '#c25e10', avBg: '#fdeede' }, { avColor: '#0e7f8f', avBg: '#e2f5f5' },\n      { avColor: '#6a34c0', avBg: '#efe9fb' },\n    ];\n\n    let feed = [\n      { subject: 'Invoice — Kirton McConkie #INV-2026-0341', from: 'Porter Christensen', email: 'porter@summaterraventures.com', initials: 'PC', t: 'invoice', s: 'review', amt: '$12,500', ago: '8m', need: true, fraud: false, av: 0 },\n      { subject: 'Re: Approve Kirton McConkie payment', from: 'Mike Watson', email: 'mike@summaterraventures.com', initials: 'MW', t: 'approval', s: 'mike', amt: '', ago: '21m', need: false, fraud: false, av: 1 },\n      { subject: \"Hunter's Landing — Draw #29 package\", from: 'Lauren Farnsworth', email: 'lauren.w.farnsworth@summaterraventures.com', initials: 'LF', t: 'draw', s: 'feegen', amt: '$962,846', ago: '42m', need: false, fraud: false, av: 2 },\n      { subject: 'Updated banking / ACH remittance details', from: 'Rock Creek Supply (?)', email: 'accounts@rockcreek-supply.com', initials: '!', t: 'bank', s: 'risk', amt: '', ago: '1h', need: true, fraud: true, av: 3 },\n      { subject: 'Wire sent — Baker Concrete', from: 'Aubrey Palmer', email: 'aubrey@summaterraventures.com', initials: 'AP', t: 'payment', s: 'paid', amt: '$126,750', ago: '1h', need: false, fraud: false, av: 3 },\n      { subject: 'Invoice — Lambert Electric', from: 'Porter Christensen', email: 'porter@summaterraventures.com', initials: 'PC', t: 'invoice', s: 'booked', amt: '$84,320', ago: '2h', need: false, fraud: false, av: 0 },\n      { subject: 'June architecture invoice', from: 'Gensler AR', email: 'ar@gensler.com', initials: 'G', t: 'invoice', s: 'received', amt: '$128,500', ago: '3h', need: true, fraud: false, av: 4 },\n      { subject: 'Approved — go ahead on Mountain Steel', from: 'Mike Watson', email: 'mike@summaterraventures.com', initials: 'MW', t: 'approval', s: 'mike', amt: '', ago: '4h', need: false, fraud: false, av: 1 },\n      { subject: '12SB — Draw #12 backup', from: 'Lauren Farnsworth', email: 'lauren.w.farnsworth@summaterraventures.com', initials: 'LF', t: 'draw', s: 'submitted', amt: '$548,000', ago: '5h', need: false, fraud: false, av: 2 },\n    ];\n    if (filter === 'Needs action') feed = feed.filter(e => e.need);\n    else if (filter === 'Fraud') feed = feed.filter(e => e.fraud);\n    feed = feed.map(e => ({\n      subject: e.subject, from: e.from, email: e.email, initials: e.initials, ago: e.ago,\n      amt: e.amt || '\\u2014',\n      type: T[e.t].type, tColor: T[e.t].tColor, tBg: T[e.t].tBg,\n      status: S[e.s].status, sColor: S[e.s].sColor, sBg: S[e.s].sBg,\n      avColor: av[e.av].avColor, avBg: av[e.av].avBg,\n      link: fromLink(e.email),\n    }));\n    const feedNote = filter === 'All' ? 'Showing 9 · last 24h' : ('Filtered: ' + filter);\n\n    // ---- Classification cards ----\n    const classes = [\n      { name: 'Vendor Invoices', sub: 'Porter / vendors', count: 6, glyph: '\\u20b1', color: '#e6207e', bg: '#fbe6f0', link: fromLink('porter@summaterraventures.com') },\n      { name: 'Approvals', sub: 'Mike Watson', count: 3, glyph: '\\u2713', color: '#12a150', bg: '#e6f6ec', link: fromLink('mike@summaterraventures.com') },\n      { name: 'Construction Draws', sub: 'Lauren Farnsworth', count: 2, glyph: '\\u25b3', color: '#f5761a', bg: '#fdeede', link: fromLink('lauren.w.farnsworth@summaterraventures.com') },\n      { name: 'Bank-Change Alerts', sub: 'P0 fraud watch', count: 1, glyph: '!', color: '#d94a4a', bg: '#fdecec', link: G + 'search/subject%3A(banking%20OR%20ACH%20OR%20routing)' },\n      { name: 'Payment Confirms', sub: 'Aubrey Palmer', count: 2, glyph: '$', color: '#0e8f8f', bg: '#e2f5f5', link: fromLink('aubrey@summaterraventures.com') },\n    ];\n    const inboxCount = classes.reduce((a, c) => a + c.count, 0);\n\n    // ---- Tracker pipeline stages ----\n    const stages = [\n      { name: 'Received', count: 3, color: '#c2c8d4' },\n      { name: 'Ready for review', count: 4, color: '#f5761a' },\n      { name: 'Approved by Mike', count: 2, color: '#12a150' },\n      { name: 'Booked in QB', count: 5, color: '#0e8f8f' },\n      { name: 'Closed', count: 9, color: accent },\n    ];\n\n    // ---- Drafts ----\n    const drafts = [\n      { title: 'Template 1 — Acknowledge invoice to Porter', meta: 'Kirton McConkie · $12,500 · created 8m ago' },\n      { title: 'Template 2 — Request W-9 from Gensler', meta: 'June architecture invoice · created 3h ago' },\n    ];\n\n    // ---- Poller health ----\n    const health = [\n      { k: 'Last poll', v: '4 min ago', color: '#16203c' },\n      { k: 'Cadence', v: 'Every 10 min', color: '#16203c' },\n      { k: 'Quota headroom', v: '62%', color: '#12a150' },\n      { k: 'Alerts today', v: '1 P0 · 0 P1', color: '#d94a4a' },\n    ];\n\n    // ---- Correspondents ----\n    const people = [\n      { name: 'Porter Christensen', role: 'Invoices · President', initials: 'PC', count: 6, ago: '8m', color: '#b3186a', bg: '#fbe6f0', link: fromLink('porter@summaterraventures.com') },\n      { name: 'Mike Watson', role: 'Approvals · CEO', initials: 'MW', count: 3, ago: '21m', color: '#0f7a3d', bg: '#e6f6ec', link: fromLink('mike@summaterraventures.com') },\n      { name: 'Lauren Farnsworth', role: 'Construction draws', initials: 'LF', count: 2, ago: '42m', color: '#c25e10', bg: '#fdeede', link: fromLink('lauren.w.farnsworth@summaterraventures.com') },\n      { name: 'Aubrey Palmer', role: 'Payment confirmations', initials: 'AP', count: 2, ago: '1h', color: '#0e7f8f', bg: '#e2f5f5', link: fromLink('aubrey@summaterraventures.com') },\n    ];\n\n    return {\n      accent, cardPad, pollAgo: 'polled 4m ago',\n      classes, inboxCount, feed, feedNote, stages, drafts, health, people,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
