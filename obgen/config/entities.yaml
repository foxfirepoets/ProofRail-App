# obgen entity registry — the ONE place entity truth lives.
#
# DIMENSIONAL MODEL (QBO target — corrected 2026-07-06):
#   location = the QBO **Department (Location)** = the legal entity. These are the 18 Realm-A
#              Locations from 6_Locations_REALM_A_API_SEED.csv, VERBATIM (must match the seeded
#              Department string exactly, or BS-by-Location won't group).
#   QBO **Class** = cost PHASE (00/20/40/80/90), NOT the entity. Phase is set PER LINE by the
#              mapping CSV's optional `new_class_phase` column — never per entity.
#   WHY THIS CHANGED: this field used to be `class` and held the entity. Emitting the entity into
#   QBO's Class dimension would land every entity in a bogus per-entity class and leave
#   Balance-Sheet-by-Location empty. Entity => location/Department; phase => Class. The emitter
#   must map location -> DepartmentRef and new_class_phase -> ClassRef (see run.py iif_je).
#
# qbw_name must match QODBC `SELECT CompanyName FROM Company` EXACTLY (pre-flight gate).
#   Values below are BEST-KNOWN CANDIDATES where noted, else FILL_ME. On the VPS, open each
#   legacy file and run `SELECT CompanyName FROM Company`; correct any mismatch here. The
#   pre-flight gate HALTS on any mismatch before a byte is trusted, so a wrong candidate is safe.

cutover: "2026-06-30"
target_files:
  partnership: "STV Projects Combined"      # new consolidated partnership file CompanyName
  parent: "Summa Terra Ventures - Corporate"

class_phases:                          # the ONLY valid QBO Class values (cost phases)
  - "00"
  - "20"
  - "40"
  - "80"
  - "90"

forbidden_account_patterns:            # G2/G6 — mapping to any of these = build failure
  - "Ask My Accountant"
  - "Uncategorized"

preserve_labeled:                      # must exist in output, untouched (G6)
  - account: "Construction Loans:HLN Arixa"
    amount: "317137.06"
    note: "JE#71 plug 10/18/2024 - awaits Arixa settlement stmt - CPA decides"

# location = seeded Realm-A Department (verbatim). qbw_name = exact CompanyName (VPS-verified).
